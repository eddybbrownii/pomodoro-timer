<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1721">
    <meta name="description" content="Flow Timer: a calm pomodoro timer, 24-hour countdown and stopwatch that works offline.">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css">
    <title>Flow Timer</title>
</head>

<body data-theme="dark" data-layout="center">
    <div id="offlineBanner" class="offline-banner hidden" role="status" aria-live="polite">
        Offline mode active — your timer still works.
    </div>

    <main class="app-shell">
        <section id="timerPanel" class="timer-panel" aria-label="Flow timer">
            <header class="top-bar">
                <div class="brand-block">
                    <span class="brand-mark" aria-hidden="true"></span>
                    <span class="brand-name">Flow</span>
                </div>

                <div class="header-actions">
                    <button id="muteBtn" class="icon-button" type="button" aria-label="Mute sound">🔊</button>
                    <button id="themeToggle" class="icon-button" type="button" aria-label="Toggle theme">☀️</button>
                    <button id="backgroundPickerBtn" class="icon-button" type="button"
                        aria-label="Choose wallpaper image">🖼️</button>
                    <button id="refreshAppBtn" class="icon-button" type="button"
                        aria-label="Refresh app and clear cache">↻</button>
                    <button id="focusToggle" class="icon-button text" type="button"
                        aria-label="Toggle focus mode">Focus</button>
                </div>
            </header>

            <div class="timer-card">
                <div class="toggle-row">
                    <button id="phaseToggle" class="mode-button" type="button" aria-pressed="true">Work</button>
                    <button id="modeToggle" class="mode-button" type="button" aria-pressed="false">24h Mode</button>
                    <button id="stopwatchToggle" class="mode-button" type="button"
                        aria-pressed="false">Stopwatch</button>
                </div>

                <div class="timer-stage">
                    <svg class="progress-ring" viewBox="0 0 220 220" aria-hidden="true">
                        <circle class="ring-track" cx="110" cy="110" r="100"></circle>
                        <circle id="progressCircle" class="ring-progress" cx="110" cy="110" r="100"></circle>
                    </svg>

                    <div class="timer-inside">
                        <span class="status-label">Focus Session</span>
                        <button id="timeDisplay" class="time-display" type="button"
                            aria-label="Edit timer duration" title="Click to set a custom time">20:00</button>
                        <span class="session-row">Sessions <strong id="sessionCount">0</strong></span>
                    </div>
                </div>

                <div id="customPanel" class="custom-panel hidden">
                    <div class="time-inputs">
                        <label>
                            <span>H</span>
                            <input id="hoursInput" type="number" min="0" max="23" value="0">
                        </label>
                        <label>
                            <span>M</span>
                            <input id="minutesInput" type="number" min="0" max="59" value="20">
                        </label>
                        <label>
                            <span>S</span>
                            <input id="secondsInput" type="number" min="0" max="59" value="0">
                        </label>
                    </div>
                    <button id="savePresetBtn" class="small-button" type="button">Save as preset</button>
                </div>

                <div class="controls">
                    <button id="startBtn" class="action-button primary" type="button">Start</button>
                    <button id="stopBtn" class="action-button secondary" type="button">Stop</button>
                    <button id="resetBtn" class="action-button secondary" type="button">Reset</button>
                </div>

                <div class="preset-row" aria-label="Quick presets">
                    <button class="preset-button is-active" type="button" data-minutes="20">20 min</button>
                    <button class="preset-button" type="button" data-minutes="25">25 min</button>
                    <button class="preset-button" type="button" data-minutes="45">45 min</button>
                </div>

                <p class="shortcut-hint">Space start/stop · R reset · tap the time to edit</p>
            </div>

            <details class="settings-panel">
                <summary>Settings</summary>

                <div class="settings-grid">
                    <label class="field-group">
                        <span>Break length (min)</span>
                        <input id="breakMinutesInput" type="number" min="1" max="60" value="5">
                    </label>

                    <label class="field-group">
                        <span>Alert sound</span>
                        <select id="soundPicker">
                            <option value="classic">Classic</option>
                            <option value="chime">Chime</option>
                            <option value="pulse">Pulse</option>
                        </select>
                    </label>

                    <label class="field-group">
                        <span>Position on screen</span>
                        <select id="panelLayoutSelect">
                            <option value="smart">Smart</option>
                            <option value="center">Center</option>
                            <option value="left">Left</option>
                            <option value="right">Right</option>
                            <option value="top-left">Top left</option>
                            <option value="top-right">Top right</option>
                        </select>
                    </label>

                    <div class="field-group">
                        <span>Wallpaper</span>
                        <div class="background-input-row">
                            <input id="backgroundUrlInput" type="url" placeholder="Paste image URL">
                            <button id="applyBackgroundBtn" class="small-button" type="button">Apply</button>
                        </div>
                        <div class="background-preview-wrap">
                            <span id="backgroundPreview" class="background-preview" title="Wallpaper preview"></span>
                            <label class="background-toggle">
                                <input id="backgroundWallpaperToggle" type="checkbox" checked>
                                <span>Show wallpaper</span>
                            </label>
                            <button id="resetBackgroundBtn" class="small-button" type="button">Remove</button>
                        </div>
                        <input id="backgroundUploadInput" type="file" accept="image/*" hidden>
                    </div>
                </div>
            </details>

            <button id="installBtn" class="action-button install-button" type="button" style="display:none;">Install
                app</button>
        </section>
    </main>

    <div id="customTimeEditor" class="custom-time-editor hidden" aria-modal="true" role="dialog"
        aria-labelledby="customTimerTitle">
        <div class="editor-card">
            <div class="editor-header">
                <h2 id="customTimerTitle">Set timer</h2>
                <button id="closeTimeEditor" class="close-button" type="button"
                    aria-label="Close timer editor">×</button>
            </div>

            <div class="time-inputs">
                <label>
                    <span>H</span>
                    <input id="editorHours" type="number" min="0" max="23" value="0">
                </label>
                <label>
                    <span>M</span>
                    <input id="editorMinutes" type="number" min="0" max="59" value="20">
                </label>
                <label>
                    <span>S</span>
                    <input id="editorSeconds" type="number" min="0" max="59" value="0">
                </label>
            </div>

            <div class="editor-actions">
                <button id="cancelTimerBtn" class="action-button secondary" type="button">Cancel</button>
                <button id="applyTimerBtn" class="action-button primary" type="button">Apply</button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
